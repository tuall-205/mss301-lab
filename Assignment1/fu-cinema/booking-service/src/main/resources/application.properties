spring.application.name=booking-service
server.port=8083

# MySQL container is published on host port 3307 (3306 is used by the local MySQL80 service)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/cinema_booking
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# movie-service is called directly (not through the gateway)
movie.service.url=http://localhost:8082
