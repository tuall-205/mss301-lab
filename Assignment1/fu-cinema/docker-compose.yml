services:
  # ---------- SQL Server: customer-service ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-sqlserver
    ports:
      - "14330:1433"   # host 1433/1434 are used by the local MSSQLSERVER service
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fucinema@2026"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Runs once after SQL Server is healthy: creates database cinema_customer
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sqlserver/init.sql:/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "Fucinema@2026", "-C", "-i", "/init.sql"]
    restart: "no"

  # ---------- MongoDB: movie-service ----------
  mongo:
    image: mongo:7.0.5
    container_name: cinema-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./docker/mongodb/data:/data/db

  # ---------- MySQL: booking-service ----------
  mysql:
    image: mysql:8.3.0
    container_name: cinema-mysql
    ports:
      - "3307:3306"   # host 3306 is taken by local MySQL80 service
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/data:/var/lib/mysql

volumes:
  sqlserver-data:
