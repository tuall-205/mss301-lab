spring.application.name=movie-service
server.port=8082

# Spring Boot 4 uses spring.mongodb.* (was spring.data.mongodb.*); authSource=admin because root lives in admin db
spring.mongodb.uri=mongodb://root:password@localhost:27017/cinema_movie?authSource=admin

# Create indexes declared by @Indexed / @CompoundIndex on startup
spring.data.mongodb.auto-index-creation=true

# Log MongoDB queries (like show-sql)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
